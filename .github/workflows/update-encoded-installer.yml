name: Update encoded Windows installer command

on:
  push:
    branches:
      - main
    paths:
      - install-windows.ps1
      - encode-installer.ps1
      - README.md
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate encoded command
        shell: pwsh
        run: ./encode-installer.ps1

      - name: Check for README changes
        id: diff
        run: |
          if git diff --quiet -- README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: bot/update-encoded-installer-${{ github.run_number }}-${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add README.md
          git commit -m "bot: update encoded Windows install command"
          git push origin "HEAD:$BRANCH"
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" \
              --base "$BASE_BRANCH" \
              --title "Update encoded Windows install command" \
              --body "Automatically regenerated from \`install-windows.ps1\` by [this workflow]($RUN_URL)."
          else
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$BRANCH" \
              --title "Update encoded Windows install command" \
              --body "Automatically regenerated from \`install-windows.ps1\` by [this workflow]($RUN_URL)."
          fi
